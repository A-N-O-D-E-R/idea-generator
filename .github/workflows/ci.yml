# Backend (mvn verify with Testcontainers), frontend (pnpm lint/build) and the GHCR image through the collection's
# reusable workflow (baseline: docs/adr/0001-adopt-anoder-baseline.md).
name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: A-N-O-D-E-R/springboot-starter-collection/.github/workflows/reusable-ci.yml@v0.3.0
    with:
      maven-dir: backend
      frontend-dir: frontend
      node-version: '22'
      image-name: ghcr.io/a-n-o-d-e-r/idea-generator
      # latest + sha on master, semver on v* tags
      image-tags: |
        type=raw,value=latest,enable={{is_default_branch}}
        type=sha
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
    permissions:
      contents: read
      packages: write

  contracts:
    # hand-synced copies of contracts owned by other repos (see scripts/check-contracts.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check-contracts.sh
        env:
          CONTRACTS_TOKEN: ${{ secrets.CONTRACTS_TOKEN }}

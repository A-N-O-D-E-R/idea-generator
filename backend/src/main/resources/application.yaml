server:
  port: ${PORT:8300}
  # Loopback by default. ideagen.auth=none (no login) refuses anything else; with oauth set HOST=0.0.0.0 to serve others.
  address: ${HOST:127.0.0.1}
  # Open event streams would hold a graceful shutdown for 30 s; upstream exits at once.
  shutdown: immediate
  # auth=oauth: sessions in Postgres, 7 days idle. Behind a TLS proxy also set SERVER_FORWARD_HEADERS_STRATEGY=native,
  # so redirect URIs are https and cookies are Secure.
  servlet.session:
    timeout: 7d
    cookie.same-site: lax
spring:
  application.name: idea-generator
  # Postgres. Dev: compose.yaml is started by spring-boot-docker-compose (mvn spring-boot:run).
  # Elsewhere set SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME and SPRING_DATASOURCE_PASSWORD.
  docker.compose.lifecycle-management: start-only
  threads.virtual.enabled: true
  # auth=oauth logins. OAuth app callbacks: <base>/login/oauth2/code/github and <base>/login/oauth2/code/google.
  # A provider left "unset" is not offered.
  security.oauth2.client.registration:
    github:
      client-id: ${GITHUB_CLIENT_ID:unset}
      client-secret: ${GITHUB_CLIENT_SECRET:unset}
      scope: [read:user]
    google:
      client-id: ${GOOGLE_CLIENT_ID:unset}
      client-secret: ${GOOGLE_CLIENT_SECRET:unset}
      scope: [openid, email, profile]
  session.jdbc.initialize-schema: never   # Flyway owns the schema (V2__sessions.sql)
  # A built frontend (../frontend/dist) is served as static files when present.
  web.resources.static-locations: file:../frontend/dist/,classpath:/static/
ideagen:
  # none: one local tenant, no login, loopback only. oauth: GitHub/Google login, one tenant per person.
  auth: ${IDEAGEN_AUTH:none}
  # Tink keyset (JSON) that encrypts stored API keys; create with --generate-keyset=<file>.
  # Empty: an ephemeral keyset (auth=none only), so stored keys are lost on restart.
  keyset-file: ${IDEAGEN_KEYSET_FILE:}
  # auth=oauth: projects of each tenant go to <data-dir>/tenants/<id>/projects (downloadable as zip).
  data-dir: ${IDEAGEN_DATA_DIR:data}
  # auth=oauth: who may sign in, as stable ids "github:<numeric id>,google:<sub>" (a refused sign-in logs its id).
  # Empty = open sign-up (logged as a warning at startup).
  allowed-logins: ${IDEAGEN_ALLOWED_LOGINS:}

# API docs: /v3/api-docs (OpenAPI) and /swagger-ui.html. Only /api routes; "try it out" sends the CSRF header.
springdoc:
  paths-to-match: /api/**
  api-docs.enabled: ${IDEAGEN_API_DOCS:true}
  swagger-ui:
    enabled: ${IDEAGEN_API_DOCS:true}
    csrf.enabled: true
    operations-sorter: alpha
    tags-sorter: alpha
